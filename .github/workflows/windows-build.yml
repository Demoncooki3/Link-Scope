name: Windows portable build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Run unit tests
        run: python -m unittest -v
      - name: Build portable application
        shell: pwsh
        run: ./build.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: LinkScope-Windows-x64
          path: dist/linkscope-v*-Windows-x64.zip
          if-no-files-found: error
      - name: Publish executable and ZIP to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $name = "linkscope-v$version"
          $tag = $name
          $existingTarget = gh release view $tag --repo $env:GITHUB_REPOSITORY --json targetCommitish --jq .targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0 -and $existingTarget -ne $env:GITHUB_SHA) { $tag = "$name-build-$env:GITHUB_RUN_NUMBER" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $tag --notes "Portable Windows 10/11 x64 application. Download $name.exe directly or extract the portable ZIP. Includes the in-app Nmap installer. Python is not required."
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag "dist/release/$name.exe" "dist/$name-Windows-x64.zip" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
