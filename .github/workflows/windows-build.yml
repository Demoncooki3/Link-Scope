name: Windows portable build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Run unit tests
        run: python -m unittest -v
      - name: Build portable application
        shell: pwsh
        run: ./build.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: LinkScope-Windows-x64
          path: dist/LinkScope-Hostnames-Windows-x64.zip
          if-no-files-found: error
